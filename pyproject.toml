[project]
name = "rdf-rules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Majid alDosari", email = "majid.aldosari@pnnl.gov" }
]
requires-python = ">=3.13"
dependencies = [
    'uritools',
    'rdf-engine',
     'plum', 'beartype',
]
[project.optional-dependencies]
dev = [
    'rdflib', 
    'pytest', 'pytest-regressions',
    'marimo',
    ]
json =   ['json2rdf']
table = ['pandas', 'json2rdf', 'openpyxl']
sparqlconstruct = ['pyoxigraph']
infandval = ['pytqshacl']


[project.scripts]
rdf-rules = "rdf_rules:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
